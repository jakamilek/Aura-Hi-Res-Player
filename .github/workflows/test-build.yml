name: Qobuz Privacy Fork Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'qobuz-privacy'
  pull_request:
    branches:
      - 'main'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-qobuz-privacy-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-qobuz-privacy-
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Ensure Android debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Privacy source audit and build sanitization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('app'), Path('innertube'), Path('kugou'), Path('lrclib'), Path('betterlyrics'), Path('simpmusic'), Path('youlyplus'), Path('artistvideo'), Path('applecanvas'), Path('echomusiccanvas'), Path('paxsenixlyrics'), Path('unison')]
          files = [p for root in roots if root.exists() for p in root.rglob('*') if p.is_file() and p.suffix in {'.kt','.kts','.java','.xml','.json','.properties','.txt'}]

          removed_domains = {
              'api-free.deepl.com': 'removed.invalid',
              'api.deepl.com': 'removed.invalid',
              'api.mistral.ai': 'removed.invalid',
              'openrouter.ai': 'removed.invalid',
          }
          for p in files:
              try:
                  text = p.read_text(errors='ignore')
              except Exception:
                  continue
              for domain, replacement in removed_domains.items():
                  text = text.replace(domain, replacement)
              p.write_text(text)

          manifest = Path('app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          hardened = re.sub(r'\s*<!--\s*install permission\s*-->\s*\n\s*<uses-permission\s+android:name="android\.permission\.REQUEST_INSTALL_PACKAGES"\s*/>\s*', '\n', text)
          hardened = re.sub(r'\s*<uses-permission\s+android:name="android\.permission\.REQUEST_INSTALL_PACKAGES"\s*/>\s*', '\n', hardened)
          if 'android.permission.REQUEST_INSTALL_PACKAGES' in hardened:
              raise SystemExit('ERROR: REQUEST_INSTALL_PACKAGES survived FOSS manifest sanitization')
          manifest.write_text(hardened)

          forbidden = [
              'api-free.deepl.com', 'api.deepl.com', 'api.mistral.ai', 'openrouter.ai',
              'lyrics-api.boidu.dev', 'lrclib.net', 'api-lyrics.simpmusic.org',
              'vivi-yt-music-server.onrender.com', 'tidal-api.geeked.wtf', 'tidal-api.binimum.org'
          ]
          hits = []
          for p in files:
              try: text = p.read_text(errors='ignore')
              except Exception: continue
              for domain in forbidden:
                  if domain in text:
                      hits.append(f'{p}: {domain}')
          if hits:
              print('FORBIDDEN NETWORK ENDPOINTS FOUND:')
              print('\n'.join(hits))
              raise SystemExit(1)

          url_re = re.compile(r'https?://([^/\"\'<>\\s]+)')
          domains = set()
          for p in files:
              try: text = p.read_text(errors='ignore')
              except Exception: continue
              domains.update(m.group(1).lower().split(':')[0] for m in url_re.finditer(text))
          print('RETAINED SOURCE URL DOMAINS:')
          for domain in sorted(domains):
              print(f'  {domain}')

          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('if (hasGoogleServicesConfig) { apply(plugin = "com.google.gms.google-services"); apply(plugin = "com.google.firebase.crashlytics") }', 'if (hasGoogleServicesConfig) { apply(plugin = "com.google.gms.google-services") }')
          s = re.sub(r'"gmsImplementation"\(platform\("com\.google\.firebase:firebase-bom:[^\"]+"\)\);\s*', '', s)
          s = re.sub(r'"gmsImplementation"\("com\.google\.firebase:firebase-(analytics|crashlytics)"\);\s*', '', s)
          s = s.replace('buildConfigField("String", "LASTFM_API_KEY", "\\\"");', 'buildConfigField("String", "LASTFM_API_KEY", "\\\"\\\"");')
          s = s.replace('buildConfigField("String", "LASTFM_SECRET", "\\\"")', 'buildConfigField("String", "LASTFM_SECRET", "\\\"\\\"")')
          p.write_text(s)
          PY
          echo 'Privacy source audit: no forbidden provider endpoints found; Firebase telemetry stripped from CI build configuration; package-install permission stripped from FOSS build manifest.'

      - name: Build arm64 FOSS debug APK
        run: ./gradlew assembleArm64FossDebug -Pnosub=true --stacktrace --console=plain

      - name: Verify hardened FOSS APK manifest
        run: |
          set -euo pipefail
          MERGED=$(find app/build/intermediates/merged_manifests -path '*arm64FossDebug*/AndroidManifest.xml' -print -quit)
          test -n "$MERGED"
          echo "Merged manifest: $MERGED"
          for permission in REQUEST_INSTALL_PACKAGES REQUEST_IGNORE_BATTERY_OPTIMIZATIONS RECORD_AUDIO FOREGROUND_SERVICE_MICROPHONE RECEIVE_BOOT_COMPLETED WRITE_SETTINGS; do
            if grep -Fq "android.permission.$permission" "$MERGED"; then
              echo "ERROR: hardened FOSS manifest still declares $permission"
              exit 1
            fi
          done
          echo 'OK: removed updater/recognition permissions are absent from arm64FossDebug.'

      - name: Build arm64 GMS debug APK
        run: ./gradlew assembleArm64GmsDebug -Pnosub=true --stacktrace --console=plain

      - name: Verify hardened GMS Cast APK manifest
        run: |
          set -euo pipefail
          MERGED=$(find app/build/intermediates/merged_manifests -path '*arm64GmsDebug*/AndroidManifest.xml' -print -quit)
          test -n "$MERGED"
          echo "Merged manifest: $MERGED"
          for permission in REQUEST_INSTALL_PACKAGES REQUEST_IGNORE_BATTERY_OPTIMIZATIONS RECORD_AUDIO FOREGROUND_SERVICE_MICROPHONE RECEIVE_BOOT_COMPLETED WRITE_SETTINGS; do
            if grep -Fq "android.permission.$permission" "$MERGED"; then
              echo "ERROR: hardened GMS manifest still declares $permission"
              exit 1
            fi
          done
          if ! grep -Fq 'com.google.android.gms.cast' "$MERGED"; then
            echo 'ERROR: GMS Cast integration is missing from merged manifest'
            exit 1
          fi
          echo 'OK: removed updater/recognition permissions are absent and GMS Cast integration remains present.'

      - name: Rename APKs
        run: |
          set -e
          mkdir -p app/build/outputs/apk/test-artifacts
          FOSS=$(find app/build/outputs/apk/arm64Foss/debug -name "*.apk" | head -n 1)
          GMS=$(find app/build/outputs/apk/arm64Gms/debug -name "*.apk" | head -n 1)
          test -n "$FOSS"
          test -n "$GMS"
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          cp "$FOSS" "app/build/outputs/apk/test-artifacts/Aura-Hi-Res-Qobuz-Privacy-FOSS-${SHORT_SHA}.apk"
          cp "$GMS" "app/build/outputs/apk/test-artifacts/Aura-Hi-Res-Qobuz-Privacy-GMS-${SHORT_SHA}.apk"
          echo "Test APKs created for ${SHORT_SHA}"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Hi-Res-Qobuz-Privacy-debug
          path: app/build/outputs/apk/test-artifacts/*.apk
          retention-days: 14
