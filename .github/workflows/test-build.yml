name: Qobuz Privacy Fork Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'qobuz-privacy'
  pull_request:
    branches:
      - 'main'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-qobuz-privacy-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-qobuz-privacy-
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Ensure Android debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Privacy source audit and build sanitization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('app'), Path('innertube'), Path('kugou'), Path('lrclib'), Path('betterlyrics'), Path('simpmusic'), Path('youlyplus'), Path('artistvideo'), Path('applecanvas'), Path('echomusiccanvas'), Path('paxsenixlyrics'), Path('unison')]
          files = [p for root in roots if root.exists() for p in root.rglob('*') if p.is_file() and p.suffix in {'.kt','.kts','.java','.xml','.json','.properties','.txt'}]

          removed_domains = {
              'api-free.deepl.com': 'removed.invalid',
              'api.deepl.com': 'removed.invalid',
              'api.mistral.ai': 'removed.invalid',
              'openrouter.ai': 'removed.invalid',
          }
          for p in files:
              try:
                  text = p.read_text(errors='ignore')
              except Exception:
                  continue
              for domain, replacement in removed_domains.items():
                  text = text.replace(domain, replacement)
              p.write_text(text)

          forbidden = [
              'api-free.deepl.com', 'api.deepl.com', 'api.mistral.ai', 'openrouter.ai',
              'lyrics-api.boidu.dev', 'lrclib.net', 'api-lyrics.simpmusic.org',
              'vivi-yt-music-server.onrender.com', 'tidal-api.geeked.wtf', 'tidal-api.binimum.org'
          ]
          hits = []
          for p in files:
              try: text = p.read_text(errors='ignore')
              except Exception: continue
              for domain in forbidden:
                  if domain in text:
                      hits.append(f'{p}: {domain}')
          if hits:
              print('FORBIDDEN NETWORK ENDPOINTS FOUND:')
              print('\n'.join(hits))
              raise SystemExit(1)

          # Print the domains still present after removed-provider sanitization. This is an
          # audit trail for the intentionally retained Qobuz/TIDAL/Spotify/Cast network surface.
          url_re = re.compile(r'https?://([^/\"\'<>\\s]+)')
          domains = set()
          for p in files:
              try: text = p.read_text(errors='ignore')
              except Exception: continue
              domains.update(m.group(1).lower().split(':')[0] for m in url_re.finditer(text))
          print('RETAINED SOURCE URL DOMAINS:')
          for domain in sorted(domains):
              print(f'  {domain}')

          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('if (hasGoogleServicesConfig) { apply(plugin = "com.google.gms.google-services"); apply(plugin = "com.google.firebase.crashlytics") }', 'if (hasGoogleServicesConfig) { apply(plugin = "com.google.gms.google-services") }')
          s = re.sub(r'"gmsImplementation"\(platform\("com\.google\.firebase:firebase-bom:[^\"]+"\)\);\s*', '', s)
          s = re.sub(r'"gmsImplementation"\("com\.google\.firebase:firebase-(analytics|crashlytics)"\);\s*', '', s)
          s = s.replace('buildConfigField("String", "LASTFM_API_KEY", "\\\"");', 'buildConfigField("String", "LASTFM_API_KEY", "\\\"\\\"");')
          s = s.replace('buildConfigField("String", "LASTFM_SECRET", "\\\"")', 'buildConfigField("String", "LASTFM_SECRET", "\\\"\\\"")')
          p.write_text(s)
          PY
          echo 'Privacy source audit: no forbidden provider endpoints found; Firebase telemetry stripped from CI build configuration.'

      - name: Build arm64 FOSS debug APK
        run: ./gradlew assembleArm64FossDebug -Pnosub=true --stacktrace --console=plain

      - name: Rename APK
        run: |
          set -e
          mkdir -p app/build/outputs/apk/test-artifacts
          APK=$(find app/build/outputs/apk/arm64Foss/debug -name "*.apk" | head -n 1)
          test -n "$APK"
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          cp "$APK" "app/build/outputs/apk/test-artifacts/Aura-Hi-Res-Qobuz-Privacy-${SHORT_SHA}.apk"
          echo "Test APK: Aura-Hi-Res-Qobuz-Privacy-${SHORT_SHA}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Hi-Res-Qobuz-Privacy-debug
          path: app/build/outputs/apk/test-artifacts/*.apk
          retention-days: 14
