name: Qobuz Privacy Fork Test Build

# Test build for the privacy-hardened Qobuz fork.
# Builds an arm64 FOSS debug APK and uploads it as a workflow artifact only.

on:
  workflow_dispatch:
  push:
    branches:
      - 'qobuz-privacy'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-qobuz-privacy-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-qobuz-privacy-
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Ensure Android debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build arm64 FOSS debug APK
        run: ./gradlew assembleArm64FossDebug --console=plain

      - name: Rename APK
        run: |
          mkdir -p app/build/outputs/apk/test-artifacts
          APK=$(find app/build/outputs/apk/arm64Foss/debug -name "*.apk" | head -n 1)
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          cp "$APK" "app/build/outputs/apk/test-artifacts/Aura-Hi-Res-Qobuz-Privacy-${SHORT_SHA}.apk"
          echo "Test APK: Aura-Hi-Res-Qobuz-Privacy-${SHORT_SHA}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Hi-Res-Qobuz-Privacy-debug
          path: app/build/outputs/apk/test-artifacts/*.apk
          retention-days: 14
