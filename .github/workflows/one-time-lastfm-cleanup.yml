name: One-time Last.fm cleanup

on:
  push:
    branches: [qobuz-privacy]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[lastfm-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qobuz-privacy

      - name: Remove embedded Last.fm credentials
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/build.gradle.kts')
          s = p.read_text()
          pattern = re.compile(
              r'\n\s*// LastFM API keys from GitHub Secrets.*?\n\s*// Tidal OAuth client id, embedded',
              re.S,
          )
          replacement = '''\n\n        // Last.fm / ListenBrainz are disabled in the privacy build.\n        // No API credentials are embedded in BuildConfig.\n        // Tidal OAuth client id, embedded'''
          new, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('Expected exactly one Last.fm credential block')
          p.write_text(new)
          PY

      - name: Verify no Last.fm credentials remain in Gradle config
        run: |
          ! grep -nE 'LASTFM_(API_KEY|SECRET)|694cbaa17c78202a133eac4656dff651|a0fdaf6060f19128c4a84f297c71e627' app/build.gradle.kts

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts
          git diff --cached --quiet && exit 0
          git commit -m 'Remove embedded Last.fm credentials [lastfm-cleanup]'
          git push origin qobuz-privacy
