name: CI Diagnostics

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Android Build & Sign"]
    types: [completed]

jobs:
  diagnostics:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create diagnostic summary
        run: |
          {
            echo "=== Aura CI Diagnostic Summary ==="
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: ${{ github.event.workflow_run.head_sha }}"
            echo "Run: ${{ github.event.workflow_run.id }}"
            echo
            echo "This artifact is generated after a failed Android build."
            echo "Use it together with the failed workflow logs."
            echo
            echo "Environment:"
            java -version 2>&1 || true
            echo
            echo "Recent git state:"
            git log -1 --oneline || true
          } > ci-error-summary.txt

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: aura-ci-diagnostics-${{ github.event.workflow_run.id }}
          path: ci-error-summary.txt
          retention-days: 14
